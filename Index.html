<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>FAM THUN - Nhập liệu</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: #f0f2f5;
      padding: 16px;
      color: #1a1a1a;
      min-height: 100vh;
    }
    .container {
      max-width: 440px;
      margin: 0 auto;
      background: white;
      border-radius: 16px;
      box-shadow: 0 4px 24px rgba(0,0,0,0.08);
      overflow: hidden;
    }
    .header {
      background: linear-gradient(135deg, #4f46e5, #7c3aed);
      color: white;
      padding: 18px 20px;
      text-align: center;
    }
    .header h1 { font-size: 18px; font-weight: 700; }
    .header p { font-size: 12px; opacity: 0.9; margin-top: 3px; }
    
    .nav {
      display: flex;
      background: #f8fafc;
      border-bottom: 1px solid #e2e8f0;
    }
    .nav-btn {
      flex: 1;
      padding: 14px;
      text-align: center;
      font-size: 14px;
      font-weight: 600;
      color: #64748b;
      cursor: pointer;
      border: none;
      background: none;
    }
    .nav-btn.active {
      color: #4f46e5;
      border-bottom: 3px solid #4f46e5;
      background: white;
    }
    
    .page { display: none; padding: 20px; }
    .page.active { display: block; }
    
    .summary-card {
      background: #f8fafc;
      border-radius: 12px;
      padding: 16px;
      margin-bottom: 16px;
      border: 1px solid #e2e8f0;
    }
    .summary-title {
      font-size: 13px;
      font-weight: 700;
      color: #64748b;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      margin-bottom: 12px;
    }
    .total-big {
      font-size: 32px;
      font-weight: 800;
      color: #4f46e5;
      text-align: center;
      margin: 8px 0 4px;
    }
    .total-label {
      text-align: center;
      font-size: 13px;
      color: #64748b;
    }
    
    .color-row { display: flex; gap: 12px; margin-top: 8px; }
    .color-item {
      flex: 1;
      background: white;
      border-radius: 10px;
      padding: 14px;
      text-align: center;
      border: 1px solid #e2e8f0;
    }
    .color-item .name {
      font-size: 13px;
      font-weight: 600;
      margin-bottom: 6px;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
    }
    .color-item .qty { font-size: 22px; font-weight: 800; }
    .dot {
      width: 12px; height: 12px;
      border-radius: 50%;
      display: inline-block;
    }
    .dot.black { background: #111; }
    .dot.white { background: #fff; border: 1.5px solid #999; }
    
    .size-table { width: 100%; border-collapse: collapse; }
    .size-table th, .size-table td {
      padding: 10px 12px;
      text-align: left;
      border-bottom: 1px solid #f1f5f9;
    }
    .size-table th { font-size: 12px; color: #64748b; font-weight: 600; }
    .size-table .size-name { font-weight: 700; }
    .size-table .size-qty { font-weight: 700; color: #4f46e5; text-align: right; }
    
    .refresh-btn {
      width: 100%;
      padding: 12px;
      background: #f1f5f9;
      border: none;
      border-radius: 10px;
      font-size: 14px;
      font-weight: 600;
      color: #475569;
      cursor: pointer;
      margin-top: 8px;
    }
    
    .fixed-box {
      background: #f8fafc;
      border: 1px solid #e2e8f0;
      border-radius: 12px;
      padding: 14px 16px;
      margin-bottom: 20px;
    }
    .fixed-row {
      display: flex;
      justify-content: space-between;
      padding: 5px 0;
      font-size: 14px;
    }
    .fixed-row .label { color: #64748b; font-weight: 500; }
    .fixed-row .value { font-weight: 700; color: #1e293b; }
    
    .form-group { margin-bottom: 16px; }
    label {
      display: block;
      font-size: 13px;
      font-weight: 600;
      color: #475569;
      margin-bottom: 7px;
    }
    
    .color-group { display: flex; gap: 12px; }
    .color-option { flex: 1; position: relative; }
    .color-option input { position: absolute; opacity: 0; width: 0; height: 0; }
    .color-option label {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      padding: 12px;
      border: 2px solid #e2e8f0;
      border-radius: 10px;
      cursor: pointer;
      font-weight: 600;
      font-size: 14px;
      margin: 0;
    }
    .color-option input:checked + label {
      border-color: #4f46e5;
      background: #eef2ff;
      color: #4f46e5;
    }
    
    select, input[type="number"], textarea {
      width: 100%;
      padding: 12px 14px;
      border: 1.5px solid #e2e8f0;
      border-radius: 10px;
      font-size: 15px;
      background: #fafafa;
    }
    select:focus, input:focus, textarea:focus {
      outline: none;
      border-color: #4f46e5;
      background: white;
    }
    textarea { resize: vertical; min-height: 55px; }
    
    .btn {
      width: 100%;
      padding: 14px;
      background: #4f46e5;
      color: white;
      border: none;
      border-radius: 12px;
      font-size: 16px;
      font-weight: 700;
      cursor: pointer;
      margin-top: 6px;
    }
    .btn:disabled { background: #a5b4fc; cursor: not-allowed; }
    
    .message {
      margin-top: 12px;
      padding: 11px;
      border-radius: 10px;
      text-align: center;
      font-size: 14px;
      display: none;
    }
    .message.success {
      background: #ecfdf5;
      color: #065f46;
      border: 1px solid #a7f3d0;
    }
    .message.error {
      background: #fef2f2;
      color: #991b1b;
      border: 1px solid #fecaca;
    }
    
    .loading {
      text-align: center;
      color: #64748b;
      padding: 20px;
      font-size: 14px;
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="header">
      <h1>FAM THUN</h1>
      <p>Quản lý nhập liệu & Lũy kế</p>
    </div>
    
    <div class="nav">
      <button class="nav-btn active" onclick="showPage('home', this)">Home</button>
      <button class="nav-btn" onclick="showPage('form', this)">Nhập liệu</button>
    </div>
    
    <!-- HOME -->
    <div id="page-home" class="page active">
      <div id="summaryContent">
        <div class="loading">Đang tải dữ liệu...</div>
      </div>
      <button class="refresh-btn" onclick="loadSummary()">↻ Làm mới dữ liệu</button>
    </div>
    
    <!-- FORM -->
    <div id="page-form" class="page">
      <div class="fixed-box">
        <div class="fixed-row">
          <span class="label">Mã hàng</span>
          <span class="value">GP016570</span>
        </div>
        <div class="fixed-row">
          <span class="label">Loại</span>
          <span class="value">Thun 2.8cm</span>
        </div>
      </div>
      
      <div class="form-group">
        <label>Màu</label>
        <div class="color-group">
          <div class="color-option">
            <input type="radio" name="mau" id="black" value="Black" checked>
            <label for="black"><span class="dot black"></span> Black</label>
          </div>
          <div class="color-option">
            <input type="radio" name="mau" id="white" value="White">
            <label for="white"><span class="dot white"></span> White</label>
          </div>
        </div>
      </div>
      
      <div class="form-group">
        <label>Size</label>
        <select id="size">
          <option value="">-- Chọn size --</option>
          <option value="XS">XS</option>
          <option value="S">S</option>
          <option value="M">M</option>
          <option value="L">L</option>
          <option value="XL">XL</option>
          <option value="XXL">XXL</option>
        </select>
      </div>
      
      <div class="form-group">
        <label>Số lượng</label>
        <input type="number" id="soLuong" min="1" placeholder="Nhập số lượng">
      </div>
      
      <div class="form-group">
        <label>Ghi chú (không bắt buộc)</label>
        <textarea id="ghiChu" placeholder="Ghi chú thêm nếu có..."></textarea>
      </div>
      
      <button class="btn" id="btnSave" onclick="save()">Lưu dữ liệu</button>
      <div id="message" class="message"></div>
    </div>
  </div>

  <script>
    // =====================================================
    // ⚠️ THAY DÒNG DƯỚI BẰNG WEB APP URL CỦA BẠN
    // =====================================================
    const SCRIPT_URL = 'https://script.google.com/macros/s/AKfycbz35tPyGL0ZeqosqDa7TH2TOUtCtIjUaXkN3q86INDYvm5OkeNfnDY4aWkZFoqynEJAnA/exec';
    
    function showPage(page, btn) {
      document.querySelectorAll('.page').forEach(p => p.classList.remove('active'));
      document.querySelectorAll('.nav-btn').forEach(b => b.classList.remove('active'));
      document.getElementById('page-' + page).classList.add('active');
      if (btn) btn.classList.add('active');
      if (page === 'home') loadSummary();
    }
    
    async function loadSummary() {
      const content = document.getElementById('summaryContent');
      content.innerHTML = '<div class="loading">Đang tải dữ liệu...</div>';
      
      if (SCRIPT_URL.includes('DÁN_WEB_APP')) {
        content.innerHTML = '<div class="loading" style="color:#c2410c">Chưa cấu hình SCRIPT_URL!<br>Sửa dòng SCRIPT_URL trong file</div>';
        return;
      }
      
      try {
        const res = await fetch(SCRIPT_URL + '?action=summary');
        const data = await res.json();
        
        if (!data.success && data.message) {
          content.innerHTML = '<div class="loading">Lỗi: ' + data.message + '</div>';
          return;
        }
        
        let html = `
          <div class="summary-card">
            <div class="summary-title">Tổng lũy kế</div>
            <div class="total-big">${(data.total || 0).toLocaleString()}</div>
            <div class="total-label">Tổng số lượng đã nhập</div>
          </div>
          
          <div class="summary-card">
            <div class="summary-title">Theo Màu</div>
            <div class="color-row">
              <div class="color-item">
                <div class="name"><span class="dot black"></span> Black</div>
                <div class="qty">${(data.byColor?.Black || 0).toLocaleString()}</div>
              </div>
              <div class="color-item">
                <div class="name"><span class="dot white"></span> White</div>
                <div class="qty">${(data.byColor?.White || 0).toLocaleString()}</div>
              </div>
            </div>
          </div>
          
          <div class="summary-card">
            <div class="summary-title">Theo Size</div>
            <table class="size-table">
              <thead>
                <tr><th>Size</th><th style="text-align:right">Số lượng</th></tr>
              </thead>
              <tbody>
        `;
        
        ['XS','S','M','L','XL','XXL'].forEach(s => {
          html += `<tr>
            <td class="size-name">${s}</td>
            <td class="size-qty">${(data.bySize?.[s] || 0).toLocaleString()}</td>
          </tr>`;
        });
        
        html += `</tbody></table></div>`;
        content.innerHTML = html;
      } catch (err) {
        content.innerHTML = '<div class="loading">Lỗi kết nối: ' + err.message + '</div>';
      }
    }
    
    async function save() {
      const btn = document.getElementById('btnSave');
      const mau = document.querySelector('input[name="mau"]:checked').value;
      const size = document.getElementById('size').value;
      const soLuong = document.getElementById('soLuong').value;
      const ghiChu = document.getElementById('ghiChu').value.trim();
      
      if (!size) { showMessage('Vui lòng chọn Size', false); return; }
      if (!soLuong || Number(soLuong) < 1) { showMessage('Vui lòng nhập Số lượng hợp lệ', false); return; }
      
      if (SCRIPT_URL.includes('DÁN_WEB_APP')) {
        showMessage('Chưa cấu hình SCRIPT_URL', false);
        return;
      }
      
      btn.disabled = true;
      btn.textContent = 'Đang lưu...';
      
      try {
        const res = await fetch(SCRIPT_URL, {
          method: 'POST',
          headers: { 'Content-Type': 'text/plain;charset=utf-8' },
          body: JSON.stringify({
            action: 'save',
            mau: mau,
            size: size,
            soLuong: soLuong,
            ghiChu: ghiChu
          })
        });
        
        const data = await res.json();
        
        btn.disabled = false;
        btn.textContent = 'Lưu dữ liệu';
        
        if (data.success) {
          showMessage(data.message, true);
          document.getElementById('size').value = '';
          document.getElementById('soLuong').value = '';
          document.getElementById('ghiChu').value = '';
          document.getElementById('black').checked = true;
        } else {
          showMessage(data.message || 'Lỗi không xác định', false);
        }
      } catch (err) {
        btn.disabled = false;
        btn.textContent = 'Lưu dữ liệu';
        showMessage('Lỗi kết nối: ' + err.message, false);
      }
    }
    
    function showMessage(text, isSuccess) {
      const msg = document.getElementById('message');
      msg.style.display = 'block';
      msg.textContent = text;
      msg.className = 'message ' + (isSuccess ? 'success' : 'error');
      if (isSuccess) setTimeout(() => msg.style.display = 'none', 2500);
    }
    
    loadSummary();
  </script>
</body>
</html>
